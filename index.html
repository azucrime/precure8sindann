      // ふたりはプリキュア / MaxHeart

      // Splash☆Star

      { id: 'passion', name: 'キュアパッション', civilian: '東せつな', series: 'フレッシュプリキュア！', color: '#dc2626', stats: [8, 8, 8, 6, 10, 5, 9, 9], tags: ['元イース・贖罪と再生', '生真面目', 'ラブとの深い絆', '不屈の使命感'], quote: '真っ赤なハートは幸せの証！うれたてフレッシュ、キュアパッション！', bio: 'かつての敵幹部イースが、ラブの無償の愛によって新しい命と心を得た姿。過去の罪を背負いながらも、全力で人々の笑顔を守り抜く気高き戦士。' },

      // ハートキャッチプリキュア！
      { id: 'blossom', name: 'キュアブロッサム', civilian: '花咲つぼみ', series: 'ハートキャッチプリキュア！', color: '#f472b6', stats: [6, 10, 8, 6, 8, 9, 10, 7], tags: ['歴代屈指の成長譚', '植物・花言葉博士', '堪忍袋の緒が切れました', '弱さを知る強さ'], quote: '大地に咲く一輪の花、キュアブロッサム！', bio: '極度の引っ込み思案でコンプレックスの塊だった少女が、えりかとの出会いを経て、敵の悲しみすら抱きしめる最も強く優しい花へと成長した感動作の象徴。' },

      { id: 'sunshine', name: 'キュアサンシャイン', civilian: '明堂院いつき', series: 'ハートキャッチプリキュア！', color: '#eab308', stats: [8, 9, 8, 7, 10, 7, 8, 8], tags: ['武道家の跡取り', 'ボクっ娘・学校の王子様', '実はかわいいもの大好き', '鉄壁の盾'], quote: '陽の光浴びる一輪の花、キュアサンシャイン！', bio: '病弱な兄に代わって道場と生徒会を背負う凛々しい武道家。つぼみたちと出会い、「家を守る強さ」と「かわいいものを好きでいる自分」の両方を肯定できるようになった。' },
      { id: 'moonlight', name: 'キュアムーンライト', civilian: '月影ゆり', series: 'ハートキャッチプリキュア！', color: '#8b5cf6', stats: [8, 7, 10, 5, 10, 4, 9, 10], tags: ['孤高の歴戦プリキュア', '喪失と再生', '圧倒的戦闘力', '深い慈愛'], quote: '月光に冴える一輪の花、キュアムーンライト！', bio: 'パートナー妖精コロンを失った深い傷を抱え、一人で全てを背負おうとしたストイックな高校生。仲間との絆によって悲しみを乗り越え、真の誇りを取り戻した。' },

      // スイートプリキュア♪
      { id: 'melody', name: 'キュアメロディ', civilian: '北条響', series: 'スイートプリキュア♪', color: '#ec4899', stats: [9, 8, 4, 9, 8, 7, 8, 7], tags: ['スポーツ万能', '天才ピアニストの才能', '奏との夫婦喧嘩', '熱い正義感'], quote: '爪弾くは荒ぶる調べ、キュアメロディ！', bio: '負けず嫌いでボーイッシュな熱血少女でありながら、音楽一家に生まれた天性の音感を持つ。奏とケンカしながらも誰より深く想い合う情熱の塊。' },
      { id: 'rhythm', name: 'キュアリズム', civilian: '南野奏', series: 'スイートプリキュア♪', color: '#f9a8d4', stats: [6, 9, 8, 8, 9, 7, 8, 8], tags: ['スイーツ部', '優等生で実は頑固', '猫の肉球マニア', '響の最高の相棒'], quote: '爪弾くはたおやかな調べ、キュアリズム！', bio: 'カップケーキ店の娘で、優しく面倒見が良い優等生。しかし響のことや自分の信念に関してはテコでも動かない強い芯と気迫を見せる。' },
      { id: 'beat', name: 'キュアビート', civilian: '黒川エレン', series: 'スイートプリキュア♪', color: '#6366f1', stats: [8, 9, 7, 9, 9, 6, 9, 8], tags: ['元セイレーン', 'ロックなラブギターロッド', '超真面目で天然', 'ビート止められない'], quote: '爪弾くは魂の調べ、キュアビート！', bio: 'ハミィとの揺るぎない友情によってプリキュアに覚醒した元・歌姫妖精。仲間になってからは驚くほど純粋で生真面目、そして少し天然な愛されキャラに。' },
      { id: 'muse', name: 'キュアミューズ', civilian: '調辺アコ', series: 'スイートプリキュア♪', color: '#f59e0b', stats: [7, 7, 9, 6, 10, 5, 8, 9], tags: ['小学生プリキュア', '仮面の下の覚悟', '生意気ツンデレ', '深い家族愛'], quote: '爪弾くは女神の調べ、キュアミューズ！', bio: '悪に染まった父（メフィスト）を救うため、小学生ながら一人で仮面を被って戦い続けた孤高の王女。大人びた毒舌の裏に、誰よりも強い家族愛を秘めている。' },

      // スマイルプリキュア！

      { id: 'sunny', name: 'キュアサニー', civilian: '日野あかね', series: 'スマイルプリキュア！', color: '#f97316', stats: [10, 8, 6, 8, 8, 7, 7, 7], tags: ['関西弁ムードメーカー', 'バレー部エース', 'お好み焼き屋の娘', '実は一番気配り上手'], quote: '太陽サンサン熱血パワー！キュアサニー！', bio: 'ボケとツッコミで場を盛り上げる熱血スポーツ少女だが、実は周囲の空気を誰よりも敏感に察知し、悩んでいる仲間にさりげなく手を差し伸べる最高の人情派。' },

      { id: 'march', name: 'キュアマーチ', civilian: '緑川なお', series: 'スマイルプリキュア！', color: '#22c55e', stats: [9, 8, 6, 6, 10, 7, 6, 8], tags: ['6人きょうだいの長女', '女子サッカー部', '直球勝負の姉御肌', '虫とおばけが苦手'], quote: '勇気リンリン直球勝負！キュアマーチ！', bio: '曲がったことが大嫌いな正義感と、5人の弟妹を世話する母性を兼ね備えた頼れる姉御。圧倒的なスピードと仲間への絆でチームを牽引する。' },
      { id: 'beauty', name: 'キュアビューティ', civilian: '青木れいか', series: 'スマイルプリキュア！', color: '#3b82f6', stats: [7, 9, 10, 6, 10, 8, 6, 9], tags: ['大和撫子・生徒会長', '私の道', '天然ボケも微笑みで受容', '氷の剣の切れ味'], quote: 'しんしんと降り積もる清き心！キュアビューティ！', bio: '才色兼備で常に丁寧な言葉遣いを崩さない優等生。みゆきたりのカオスなノリもニコニコと受け入れつつ、敵の欺瞞は氷の刃と正論で一刀両断する凛とした知性派。' },

      // ドキドキ！プリキュア

      { id: 'sword', name: 'キュアソード', civilian: '剣崎真琴', series: 'ドキドキ！プリキュア', color: '#a855f7', stats: [8, 7, 7, 9, 10, 4, 9, 10], tags: ['トランプ王国の最後の戦士', '国民的アイドルまこぴー', '重すぎる使命感', '一途な忠誠'], quote: '勇気の刃！キュアソード！', bio: '滅亡した故郷と王女を救うため、孤高を貫いて戦っていた歌姫。マナたちの温かい愛に触れて心を開き、歌で人々の心を繋ぐ真のアイドルへと進化した。' },

      // ハピネスチャージプリキュア！

      { id: 'scarlet', name: 'キュアスカーレット', civilian: '紅城トワ', series: 'Go！プリンセスプリキュア', color: '#dc2626', stats: [8, 8, 8, 9, 10, 6, 9, 10], tags: ['ホープキングダム王女', '元トワイライト', 'バイオリンと気品', '世間知らずな可愛さ'], quote: '深紅の炎のプリンセス！キュアスカーレット！', bio: '絶望の魔女に囚われていた本物の王女。自らの過ちから目を背けず、真紅の炎のように気高い覚悟で未来を切り拓く一方、庶民の文化に目を輝かせる愛らしさも持つ。' },

      { id: 'magical', name: 'キュアマジカル', civilian: '十六夜リコ', series: '魔法つかいプリキュア！', color: '#a855f7', stats: [7, 8, 10, 7, 9, 6, 8, 9], tags: ['座学トップの努力家', '王道ツンデレ', 'みらいとの唯一無二の絆', '立派な魔法つかい'], quote: 'ふたりの魔法！キュアマジカル！', bio: '優秀な姉へのコンプレックスから少し背伸びしていた魔法界の少女。みらいの真っ直ぐな肯定によって本来の力を発揮し、誰よりも頼もしい相棒へと成長した。' },

      { id: 'macaron', name: 'キュアマカロン', civilian: '琴爪ゆかり', series: 'キラキラ☆プリキュアアラモード', color: '#a855f7', stats: [7, 6, 9, 9, 6, 8, 8, 10], tags: ['気まぐれな猫系美女', '何でもこなす天才肌', '退屈と孤独の裏返し', 'あきらとの絆'], quote: '美しさとトキメキをレッツ・ラ・まぜまぜ！キュアマカロン！できあがり！', bio: '容姿端麗・成績優秀で何でも完璧にこなせるがゆえに、世界に退屈していた高校生。いちかたちの不器用な情熱に触れ、自らの弱さも愛せるようになった孤高の美。' },
      { id: 'chocolat', name: 'キュアショコラ', civilian: '剣城あきら', series: 'キラキラ☆プリキュアアラモード', color: '#dc2626', stats: [9, 10, 7, 7, 10, 8, 7, 8], tags: ['宝塚系の麗人騎士', '病弱な妹思い', '困った人を放っておけない', '圧倒的包容力'], quote: '強さと愛をレッツ・ラ・まぜまぜ！キュアショコラ！できあがり！', bio: 'ボーイッシュで誰に対しても紳士的に接する高校生。入院中の妹を笑顔にするためにチョコレート作りを学び、仲間のピンチには常に盾となって立ちはだかる。' },
      { id: 'parfait', name: 'キュアパルフェ', civilian: 'キラ星シエル', series: 'キラキラ☆プリキュアアラモード', color: '#14b8a6', stats: [9, 7, 8, 10, 8, 7, 7, 10], tags: ['パリ帰りの天才パティシエ', '元妖精キラリン', 'トレビアン！', '妥協なき探究心'], quote: '夢と希望をレッツ・ラ・まぜまぜ！キュアパルフェ！できあがり！', bio: '妖精の身でありながらパリで人間として修行を積み、トップパティシエに登り詰めた努力の塊。弟ピカリオとの葛藤を乗り越え、虹色のパフェのように輝く。' },

      // スター☆トゥインクルプリキュア

      { id: 'milky', name: 'キュアミルキー', civilian: '羽衣ララ', series: 'スター☆トゥインクルプリキュア', color: '#14b8a6', stats: [8, 9, 8, 7, 9, 8, 9, 7], tags: ['サマーン星人・オヨ〜', 'AI依存からの自立', '異文化交流の象徴', '不器用で誠実'], quote: '天にあまねくミルキーウェイ！キュアミルキー！', bio: 'AIが全てを決める効率重視の星から来た宇宙人。地球でひかるたちとぶつかり合いながら「自分の心で考え、違う価値観の仲間と手を取り合う喜び」を知った。' },

      { id: 'selene', name: 'キュアセレーネ', civilian: '香久矢まどか', series: 'スター☆トゥインクルプリキュア', color: '#8b5cf6', stats: [6, 8, 10, 7, 10, 7, 7, 9], tags: ['学園の月・生徒会長', '弓道・ピアノ全国制覇', '父の期待から自らの意志へ', '秘めた大胆さ'], quote: '夜空に輝く神秘の月あかり！キュアセレーネ！', bio: '厳格な父の教えに従い完璧な令嬢を演じていたが、仲間を守るために初めて自らの意志で行動を起こした凛とした少女。実はドーナツや冒険にワクワクする一面も。' },

      // ヒーリングっど♡プリキュア
      { id: 'grace', name: 'キュアグレース', civilian: '花寺のどか', series: 'ヒーリングっど♡プリキュア', color: '#ec4899', stats: [7, 10, 7, 7, 9, 9, 9, 9], tags: ['ふわあ〜生きてるって感じ', '大病を乗り越えた強さ', '自分の心と体は自分のもの', '凛とした慈愛'], quote: '重なる二つの花！キュアグレース！', bio: '幼少期の長い闘病生活を乗り越えたため、走れることや日常のすべてに感謝できる優しい少女。しかし理不尽な要求に対しては「自分の尊厳」を毅然と守り抜く歴代屈指の芯の強さを持つ。' },
      { id: 'fontaine', name: 'キュアフォンテーヌ', civilian: '沢泉ちゆ', series: 'ヒーリングっど♡プリキュア', color: '#38bdf8', stats: [8, 8, 10, 6, 10, 7, 6, 9], tags: ['老舗温泉宿の若女将候補', '陸上ハイジャンパー', '二兎を追って両方得る', '頼れる姉御'], quote: '交わる二つの流れ！キュアフォンテーヌ！', bio: '聡明で気風が良く、困っている人を見れば迷わず手を差し伸べる優等生。旅館の跡取りとハイジャンプの選手という二つの夢を、妥協せず両方追い求める強い信念の持ち主。' },
      { id: 'sparkle', name: 'キュアスパークル', civilian: '平光ひなた', series: 'ヒーリングっど♡プリキュア', color: '#eab308', stats: [8, 9, 4, 9, 6, 9, 9, 5], tags: ['トレンド・コスメ大好き', 'ノリと直感のムードメーカー', '怖気づいても戻ってくる人間味', '素直に謝れる誠実さ'], quote: '溶け合う二つの光！キュアスパークル！', bio: '明るくフレンドリーで流行に敏感な現代っ子。勉強は苦手で強敵に怯えてしまう等身大の弱さも持つが、友達のために涙を流して駆けつけ、自分の非は真っ直ぐ謝れる最高の人間力を持つ。' },
      { id: 'earth', name: 'キュアアース', civilian: '風鈴アスミ', series: 'ヒーリングっど♡プリキュア', color: '#a855f7', stats: [8, 8, 8, 6, 10, 9, 7, 8], tags: ['地球の力から生まれた精霊', 'ラテ様第一主義', '天然おっとり敬語', '感情を学ぶ純粋さ'], quote: '時を経て繋がる二つの風！キュアアース！', bio: '地球の祈りから生まれたばかりの風の精霊。最初は人間社会の常識を知らず天然な行動を見せるが、のどかたちと共に「悔しさ」や「慈しみ」を一つずつ学んでいく気高き守護者。' },

      { id: 'summer', name: 'キュアサマー', civilian: '夏海まなつ', series: 'トロピカル〜ジュ！プリキュア', color: '#ec4899', stats: [10, 8, 3, 10, 7, 10, 6, 7], tags: ['今一番大事なこと！', 'トロピカってる〜！', '超絶ポジティブ行動派', 'リップが勇気の証'], quote: 'ときめく常夏！キュアサマー！', bio: '考えるより先に走り出し、「今、一番大事なこと」に全力を注ぐ常夏の太陽。どんなに悲しい別れが待っていようとも、今この瞬間を笑顔で楽しみ抜く圧倒的なバイタリティの塊。' },
      { id: 'coral', name: 'キュアコーラル', civilian: '涼村さんご', series: 'トロピカル〜ジュ！プリキュア', color: '#a855f7', stats: [4, 10, 7, 8, 8, 10, 9, 8], tags: ['コスメショップの娘', '自分の「かわいい」を信じる', '全肯定の優しさ', 'ペケッツの絶対防御'], quote: 'きらめく宝石！キュアコーラル！', bio: '周囲に合わせすぎて自分の意見を言えなかった少女が、まなつとローラに出会い「自分の好きなかわいいを貫く強さ」を獲得。誰の心も否定しない無敵の優しさと防御力を誇る。' },
      { id: 'papaya', name: 'キュアパパイア', civilian: '一之瀬みのり', series: 'トロピカル〜ジュ！プリキュア', color: '#eab308', stats: [4, 7, 10, 9, 8, 7, 8, 9], tags: ['図書委員・小説の書き手', 'ポーカーフェイスの情熱家', '人魚伝説マニア', '変身後の弾けるギャップ'], quote: 'ひらめく果実！キュアパパイア！', bio: '普段は無表情で感情を表に出さない学年トップの読書家だが、物語への愛と想像力は誰よりも熱い。変身すると一転して表情豊かに弾けるギャップが魅力の知性派クリエイター。' },

      { id: 'lamer', name: 'キュアラメール', civilian: 'ローラ', series: 'トロピカル〜ジュ！プリキュア', color: '#38bdf8', stats: [9, 7, 8, 10, 8, 6, 8, 10], tags: ['次期女王を目指す人魚', '野心と自信の塊', 'まなつとの魂の友情', '自分の足で立つ覚悟'], quote: 'ゆらめく大海原！キュアラメール！', bio: '「グランオーシャンの次期女王になる」という明確な野心を持ち、最初は打算的だった人魚の少女。まなつたちとのかけがえのない友情のために、自らの足で立ち上がる奇跡を起こした。' },

      // デリシャスパーティ♡プリキュア
      { id: 'precious', name: 'キュアプレシャス', civilian: '和実ゆい', series: 'デリシャスパーティ♡プリキュア', color: '#ec4899', stats: [9, 10, 4, 8, 8, 10, 6, 7], tags: ['デリシャスマイル〜！', 'おばあちゃんの言ってた', '驚異の身体能力と食欲', '全肯定の食卓'], quote: 'あつあつごはんで、みなぎるパワー！キュアプレシャス！', bio: '定食屋の娘で、運動神経と食欲は底なし。「ごはんは笑顔」という祖母の言葉を胸に、どんな相手とも温かい食卓を囲んで幸せを分かち合おうとする太陽のような少女。' },

      { id: 'yumyum', name: 'キュアヤムヤム', civilian: '華満らん', series: 'デリシャスパーティ♡プリキュア', color: '#eab308', stats: [8, 8, 6, 10, 6, 9, 8, 8], tags: ['ラーメン屋の娘', 'キュルルン名レポーター', '止まらない独創的グルメ愛', '自分の好きを貫く'], quote: 'きらめくヌードル・エモーション！キュアヤムヤム！', bio: '美味しいものへの感動が溢れすぎて周囲に「変わっている」と思われ、想いを隠していた少女。ありのままの表現を肯定してくれた仲間と共に、情熱を世界へ発信する。' },
      { id: 'finale', name: 'キュアフィナーレ', civilian: '菓彩あまね', series: 'デリシャスパーティ♡プリキュア', color: '#a855f7', stats: [8, 8, 9, 7, 10, 7, 8, 9], tags: ['元ジェントルー', 'フルーツパーラーの娘・生徒会長', '空手の手練れ', '揺るぎない正義と誇り'], quote: 'ジェントルに、ゴージャスに、咲き誇るスイートネス！キュアフィナーレ！', bio: '洗脳されていた過去の罪から決して逃げず、自らの手でパフェのように多様な想いを一つにまとめる生徒会長。武道の達人でもあり、気高く誠実な正義の体現者。' },

      { id: 'sky', name: 'キュアスカイ', civilian: 'ソラ・ハレワタール', series: 'ひろがるスカイ！プリキュア', color: '#0ea5e9', stats: [10, 8, 6, 8, 10, 7, 7, 9], tags: ['ヒーローの出番です！', 'スカイランド出身の武道少女', 'ヒーロー手帳と鍛錬', 'ましろとの絆'], quote: '無限にひろがる青い空！キュアスカイ！', bio: '幼い頃に自分を救ってくれたヒーローに憧れ、毎日ひたむきな鍛錬を重ねてきた少女。「一人で背負う強さ」から、ましろたちと支え合う「本当のヒーローの強さ」へと飛翔した。' },
      { id: 'prism', name: 'キュアプリズム', civilian: '虹ヶ丘ましろ', series: 'ひろがるスカイ！プリキュア', color: '#f472b6', stats: [5, 10, 7, 8, 8, 10, 9, 7], tags: ['ソラの太陽であり帰る場所', '絵本作家への道', '傾聴と受容の天才', '実は一番芯が強い'], quote: 'ふわりひろがる優しい光！キュアプリズム！', bio: '特別な特技がないことに悩みながらも、相手の心にそっと寄り添い、温かく照らし出す類まれな優しさを持つ少女。彼女の描く絵本と言葉は、傷ついた世界すらも優しく包み込む。' },

      { id: 'butterfly', name: 'キュアバタフライ', civilian: '聖あげは', series: 'ひろがるスカイ！プリキュア', color: '#ec4899', stats: [8, 9, 7, 9, 8, 9, 7, 8], tags: ['18歳の成人プリキュア', '最強の保育士の卵', 'アゲてくよ〜！', '視野の広い精神的支柱'], quote: 'アゲてひろがるワンダフル！キュアバタフライ！', bio: 'ギャル風の明るいノリで場を盛り上げつつ、保育士を目指して学ぶ中で培った鋭い観察眼と包容力で年下の仲間たちを精神的に支える、最高に頼もしいお姉さん。' },
      { id: 'majesty', name: 'キュアマジェスティ', civilian: 'プリンセス・エル', series: 'ひろがるスカイ！プリキュア', color: '#8b5cf6', stats: [8, 9, 8, 8, 9, 8, 7, 9], tags: ['一番星から生まれた命运の子', 'みんなに愛され育った結晶', '気高き神秘のプリンセス', '未来を切り拓く力'], quote: '降り立つ気高き神秘！キュアマジェスティ！', bio: 'ソラやましろん、ツバサ、あげはの深い愛情を一身に受けて育ち、「守られるだけの存在」から「大好きな家族を自らも守る存在」へと覚醒した神秘のプリンセス。' },

      { id: 'nyammy', name: 'キュアニャミー', civilian: '猫屋敷ユキ', series: 'わんだふるぷりきゅあ！', color: '#38bdf8', stats: [9, 6, 9, 7, 10, 4, 6, 10], tags: ['気高き白猫', 'まゆの笑顔だけが絶対正義', 'クールで孤高の実力者', 'ツンデレの極致'], quote: '気高くかわいくきらめく世界！キュアニャミー！', bio: '基本は自由気ままな白猫でありながら、自分にとって唯一無二の存在である「まゆ」を守ることに関しては一切の妥協を許さない孤高の騎士。徐々にこむぎたちにも心を開いていく。' },
      { id: 'lillian', name: 'キュアリリアン', civilian: '猫屋敷まゆ', series: 'わんだふるぷりきゅあ！', color: '#10b981', stats: [4, 9, 8, 8, 8, 9, 10, 7], tags: ['手芸・コスメ・クリエイター気質', '転校生で極度の心配性', 'ユキを守るために覚醒', '怖くない、怖くない'], quote: '結んで紡いでつながる世界！キュアリリアン！', bio: '相手の顔色を伺いすぎて踏み出せなかった繊細な少女だが、手先が器用で集中力は抜群。大切なユキやいろはを守るため、「怖くない、怖くない」と自らを奮い立たせて立つ勇気の人。' },

      { id: 'kyunkyun', name: 'キュアキュンキュン', civilian: '紫雨こころ', series: 'キミとアイドルプリキュア♪', color: '#a855f7', stats: [8, 8, 7, 10, 8, 6, 8, 9], tags: ['キレキレのダンスパフォーマー', '心キュンキュンしてます！', 'クールに見えて情熱の塊', 'ストイックな好き'], quote: 'キミと踊る、ハートの雫！心キュンキュン、キュアキュンキュン！', bio: '一見クールで落ち着いて見えるが、心の中には「キュンキュンする大好き」への熱い情熱を秘めたダンス少女。圧倒的な表現力と妥協なきステップで観客を魅了する。' },

    // ---------------------------------------------------------------------------
    // 8軸 相性計算エンジン（波形パターン一致＋コサイン類似度＋偏差距離のハイブリッド）
    // ---------------------------------------------------------------------------
    function calculateCompatibility(userStats, char, selectedKeywords) {
      let sqDiffSum = 0;
      let absDiffSum = 0;
      let synergySum = 0;

      // 平均値からの偏差（波形の凹凸パターンそのもの）の一致度も計算
      const uMean = userStats.reduce((a, b) => a + b, 0) / 8;
      const cMean = char.stats.reduce((a, b) => a + b, 0) / 8;
      let patternDot = 0;
      let uNorm = 0;
      let cNorm = 0;

      for (let i = 0; i < 8; i++) {
        const u = userStats[i];
        const c = char.stats[i];
        const d = Math.abs(u - c);
        absDiffSum += d;
        sqDiffSum += d * d;

        const uDev = u - uMean;
        const cDev = c - cMean;
        patternDot += uDev * cDev;
        uNorm += uDev * uDev;
        cNorm += cDev * cDev;

        // 補完シナジー
        if ((u >= 7.5 && c >= 7.5) || (u < 6.0 && c >= 8.5) || (c < 6.0 && u >= 8.5)) {
          synergySum += (u + c) / 2;
        } else {
          synergySum += Math.min(u, c) * 0.85;
        }
      }

      // 1. 絶対値の近さ (RMSEベース)
      const rmse = Math.sqrt(sqDiffSum / 8); // 0 〜 約5.5
      const distanceScore = Math.max(0, 100 - rmse * 18.5);

      // 2. 波形の凹凸パターンの相関係数 (-1 〜 +1 を 0 〜 100 に変換)
      const corr = (uNorm > 0 && cNorm > 0) ? (patternDot / (Math.sqrt(uNorm) * Math.sqrt(cNorm))) : 0;
      const patternScore = ((corr + 1) / 2) * 100;

      // 共鳴度 = 絶対値の近さ(65%) + 波形の凹凸の形の一致(35%)
      const resonanceRaw = distanceScore * 0.65 + patternScore * 0.35;
      const resonance = Math.min(99, Math.max(45, Math.round(resonanceRaw)));

      // 補完シナジー
      const complement = Math.min(99, Math.round(50 + (synergySum / 80) * 49));

      // 魂のキーワードボーナス（選んだ軸でキャラの数値とユーザーの数値がともに高く近い場合にボーナス）
      let keywordBonus = 0;
      selectedKeywords.forEach((kwId) => {
        const kw = SOUL_KEYWORDS.find((k) => k.id === kwId);
        if (kw) {
          const axisIndex = AXES.findIndex((a) => a.key === kw.axis);
          if (axisIndex >= 0) {
            const diff = Math.abs(userStats[axisIndex] - char.stats[axisIndex]);
            if (diff <= 1.2 && char.stats[axisIndex] >= 8) {
              keywordBonus += 1.6;
            } else if (char.stats[axisIndex] >= 9) {
              keywordBonus += 0.8;
            }
          }
        }
      });

      // 総合スコア（8軸の波形共鳴度を82%、補完シナジーを18%にしてキャラクターごとの差別化を最大化）
      const total = Math.min(99, Math.round(resonance * 0.82 + complement * 0.18 + keywordBonus));

      const sharedStrengths = AXES.map((a, idx) => ({
        ...a,
        score: (userStats[idx] + char.stats[idx]) - Math.abs(userStats[idx] - char.stats[idx]) * 1.5,
      })).sort((a, b) => b.score - a.score);

      const admireAxis = AXES.map((a, idx) => ({
        ...a,
        gap: char.stats[idx] - userStats[idx],
        charVal: char.stats[idx],
      })).sort((a, b) => b.gap - a.gap)[0];

      return {
        total,
        resonance,
        complement,
        absDiffSum: Number(absDiffSum.toFixed(1)),
        topSharedAxis: sharedStrengths[0],
        secondSharedAxis: sharedStrengths[1],
        admireAxis: admireAxis.gap > 0.8 ? admireAxis : sharedStrengths[1],
      };
    }

    // ---------------------------------------------------------------------------
    // SVG 8軸オクタゴン・レーダーチャート コンポーネント
    // ---------------------------------------------------------------------------
    function OctagonRadarChart({ userStats, oshiStats, bestStats, oshiName, bestName }) {
      const size = 330;
      const center = size / 2;
      const radius = 108;

      const getPoint = (index, value) => {
        const angle = (Math.PI * 2 * index) / 8 - Math.PI / 2;
        const r = (value / 10) * radius;
        return {
          x: center + r * Math.cos(angle),
          y: center + r * Math.sin(angle),
        };
      };

      const makePolygon = (stats) =>
        stats.map((val, i) => {
          const pt = getPoint(i, val);
          return `${pt.x},${pt.y}`;
        }).join(' ');

      return (
        <div className="flex flex-col items-center">
          <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="max-w-full overflow-visible">
            {[2, 4, 6, 8, 10].map((level) => (
              <polygon
                key={level}
                points={[0, 1, 2, 3, 4, 5, 6, 7].map((i) => {
                  const pt = getPoint(i, level);
                  return `${pt.x},${pt.y}`;
                }).join(' ')}
                fill={level === 10 ? 'rgba(253, 242, 248, 0.55)' : 'none'}
                stroke="#e2e8f0"
                strokeWidth="1"
              />
            ))}

            {[0, 1, 2, 3, 4, 5, 6, 7].map((i) => {
              const pt = getPoint(i, 10);
              return <line key={i} x1={center} y1={center} x2={pt.x} y2={pt.y} stroke="#cbd5e1" strokeWidth="1" strokeDasharray="3 3" />;
            })}

            {bestStats && (
              <polygon
                points={makePolygon(bestStats)}
                fill="rgba(56, 189, 248, 0.16)"
                stroke="#0284c7"
                strokeWidth="2"
                strokeDasharray="4 2"
              />
            )}

            {oshiStats && (
              <polygon
                points={makePolygon(oshiStats)}
                fill="rgba(168, 85, 247, 0.18)"
                stroke="#9333ea"
                strokeWidth="2"
              />
            )}

            <polygon
              points={makePolygon(userStats)}
              fill="rgba(236, 72, 153, 0.30)"
              stroke="#db2777"
              strokeWidth="3"
            />

            {userStats.map((val, i) => {
              const pt = getPoint(i, val);
              return <circle key={i} cx={pt.x} cy={pt.y} r="4" fill="#db2777" stroke="#fff" strokeWidth="1.5" />;
            })}

            {AXES.map((axis, i) => {
              const angle = (Math.PI * 2 * i) / 8 - Math.PI / 2;
              const labelRadius = radius + 30;
              const lx = center + labelRadius * Math.cos(angle);
              const ly = center + labelRadius * Math.sin(angle);
              return (
                <g key={axis.key}>
                  <text
                    x={lx}
                    y={ly - 4}
                    textAnchor="middle"
                    dominantBaseline="middle"
                    className="text-[11px] font-bold fill-slate-700"
                  >
                    {axis.short}
                  </text>
                  <text
                    x={lx}
                    y={ly + 9}
                    textAnchor="middle"
                    dominantBaseline="middle"
                    className="text-[10px] font-semibold fill-pink-600"
                  >
                    {userStats[i].toFixed(1)}
                  </text>
                </g>
              );
            })}
          </svg>

          <div className="flex flex-wrap justify-center gap-4 mt-2 text-xs font-medium text-slate-600">
            <div className="flex items-center gap-1.5">
              <span className="w-3 h-3 rounded-full bg-pink-600 inline-block"></span>
              <span>あなた</span>
            </div>
            {oshiStats && (
              <div className="flex items-center gap-1.5">
                <span className="w-3 h-3 rounded-full bg-purple-600 inline-block"></span>
                <span>推し（{oshiName}）</span>
              </div>
            )}
            {bestStats && (
              <div className="flex items-center gap-1.5">
                <span className="w-3 h-3 rounded-full bg-sky-600 inline-block"></span>
                <span>最高相性（{bestName}）</span>
              </div>
            )}
          </div>
        </div>
      );
    }

      const maxAxisPoints = useMemo(() => {
        const maxMap = {};
        AXES.forEach((a) => { maxMap[a.key] = 0; });
        QUESTIONS.forEach((q) => {
          AXES.forEach((a) => {
            const maxInQ = Math.max(...q.options.map((o) => o.scores[a.key] || 0));
            maxMap[a.key] += maxInQ;
          });
        });
        return maxMap;
      }, []);

      // 8軸スコア算出
      const userStats = useMemo(() => {
        const raw = {};
        AXES.forEach((a) => { raw[a.key] = 0; });

          const q = QUESTIONS.find((item) => item.id === Number(qId));
          if (q && q.options[optIdx]) {
            const scores = q.options[optIdx].scores;
            Object.entries(scores).forEach(([k, v]) => {

            });

        selectedKeywords.forEach((kwId) => {
          const kw = SOUL_KEYWORDS.find((k) => k.id === kwId);

          // 各軸の最大獲得可能量の約68%を取れば10.0に到達するバランス設計
          const practicalMax = Math.max(14, maxAxisPoints[a.key] * 0.68);

                <div className="bg-gradient-to-br from-pink-50 via-purple-50 to-sky-50 rounded-3xl p-6 sm:p-8 shadow-md border border-pink-200">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
                    <div>
                      <span className="inline-flex items-center gap-1 text-xs font-bold px-3 py-1 rounded-full bg-white text-pink-600 shadow-sm mb-2">
                        ✦ 8-Axis Deep Resonance Report
                      </span>
                      <h3 className="text-xl font-extrabold text-slate-800">
                        あなただけの8軸深層パーソナル診断レター
                      </h3>
                      <p className="text-xs text-slate-600 mt-0.5">
                        全24問の8軸波形とキャラクターの生き様から導き出された詳細分析レポートです。
                      </p>
                    </div>
                    <button
                      onClick={handleGenerateReport}
                      className="px-4 py-2 rounded-xl bg-white hover:bg-pink-50 text-pink-600 border border-pink-200 font-bold text-xs shadow-sm transition shrink-0"
                    >
                      ↻ レターを更新
                    </button>
                  </div>

                  <div className="bg-white/95 rounded-2xl p-5 sm:p-6 border border-pink-100 text-sm text-slate-700 leading-relaxed whitespace-pre-wrap shadow-inner">
                    {deepReport || generateLocalDeepLetter(userStats, archetype, oshiMatch, bestMatch, selectedKeywords)}
                  </div>
                </div>

                {/* 5. SNSシェア＆結果カード画像保存・もう一度占う */}
                <div className="bg-white/90 rounded-3xl p-6 shadow-sm border border-pink-100 flex flex-col items-center text-center">
                  <h3 className="text-base font-extrabold text-slate-800 mb-1">
                    診断結果をSNSでシェア・画像保存する
                  </h3>
                  <p className="text-xs text-slate-500 mb-4">
                    X（旧Twitter）へのワンタップ投稿や、8軸スコア入りの特製画像カードを保存できます。
                  </p>

                  <div className="flex flex-wrap justify-center gap-3">
                    <button
                      onClick={handleShareX}
                      className="px-5 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm flex items-center gap-2 transition shadow-sm"
                    >
                      𝕏 診断結果をポストする
                    </button>

                    <button
                      onClick={generateShareCard}
                      className="px-5 py-2.5 rounded-xl bg-pink-600 hover:bg-pink-700 text-white font-bold text-sm flex items-center gap-2 transition shadow-sm"
                    >
                      🖼 8軸結果カード画像を生成する
                    </button>

                    <button
                      onClick={() => {
                        setAnswers({});
                        setSelectedKeywords([]);
                        setCurrentQIndex(0);
                        setDeepReport('');
                        setCardImageUrl(null);
                        setStep(1);
                      }}
                      className="px-5 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-100 text-slate-700 font-bold text-sm flex items-center gap-2 transition"
                    >
                      ↺ 最初からもう一度占う
                    </button>
                  </div>

                  <canvas ref={canvasRef} className="hidden" />

                  {cardImageUrl && (
                    <div className="mt-6 flex flex-col items-center">
                      <img
                        src={cardImageUrl}
                        alt="診断結果カード"
                        className="max-w-xs sm:max-w-sm rounded-2xl shadow-lg border border-pink-200"
                      />
                      <a
                        href={cardImageUrl}
                        download="precure-8axis-fortune-card.png"
                        className="mt-3 px-5 py-2 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold shadow"
                      >
                        画像を端末に保存（ダウンロード）
                      </a>
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
